services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    ports:
      - "5432:5432"
    volumes:
      - ~/timescaledb_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${DB_PASS}

  service:
    image: ghcr.io/cloudsftp/botificator-service:latest
    #ports:
    #  - "6680:6680"
    volumes:
      - .env:/.env
